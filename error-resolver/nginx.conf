map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8501;
    server_name _;

    # Send nginx access/error logs to stdout/stderr so App Runner captures them
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Streamlit WebSocket endpoint — hardcode upgrade headers in case App Runner
    # strips them before forwarding to the container
    location = /_stcore/stream {
        add_header X-Served-By "nginx" always;
        proxy_pass         http://localhost:8502;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    "websocket";
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # All other requests (health check, static assets, etc.)
    location / {
        proxy_pass         http://localhost:8502;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}
